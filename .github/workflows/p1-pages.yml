name: Publish P1 (preserve P0)

on:
  push:
    branches: [p1-release]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  P0_COMMIT: 7915a15d368091937cbaf92a08ceac038dfa48d0

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout P1
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install P1 dependencies
        run: npm ci

      - name: Validate chemistry data and run unit tests
        run: npm run validate:data && npm test

      - name: Build local P1
        run: npm run build

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Test local P1 (mock APIs only)
        run: npm run test:e2e

      - name: Build isolated static P1 (no default key)
        run: npm run build:pages

      - name: Test static P1 (mock APIs only)
        run: npm run test:pages

      - name: Checkout immutable P0 source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.P0_COMMIT }}
          path: .pages-p0

      - name: Rebuild preserved P0
        working-directory: .pages-p0
        run: npm ci && npm run build

      - name: Assemble P0 root and isolated P1 subdirectory
        run: npm run assemble:pages

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload both versions as one isolated Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-dist

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}p1/
    steps:
      - name: Deploy P1 while preserving P0
        id: deployment
        uses: actions/deploy-pages@v4
