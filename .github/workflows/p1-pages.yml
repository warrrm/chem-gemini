name: Publish P0 showcase and P1

on:
  push:
    branches: [p1-release]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Tag for the manifest, full commit for verifying the source before it can run.
  P0_TAG: v2.0.1-p0
  P0_COMMIT: d27bd8de07e0d2a6cfa1393d7e15b2324cd0ebbd

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout P1
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install P1 dependencies
        run: npm ci

      - name: Validate chemistry data and run unit tests
        run: npm run validate:data && npm test

      - name: Build local P1
        run: npm run build

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Test local P1 (mock APIs only)
        run: npm run test:e2e

      - name: Build isolated static P1 (no default key)
        run: npm run build:pages

      - name: Test static P1 (mock APIs only)
        run: npm run test:pages

      - name: Checkout tagged P0 classroom showcase
        uses: actions/checkout@v4
        with:
          ref: ${{ env.P0_TAG }}
          path: .pages-p0
          persist-credentials: false

      - name: Verify pinned P0, build root-path static edition and test it (mock APIs only)
        working-directory: .pages-p0
        run: |
          test "$(git rev-parse HEAD)" = "$P0_COMMIT"
          npm ci
          npm run validate:data && npm test
          npm run build:pages && npm run test:pages

      - name: Assemble P0 root and isolated P1 subdirectory
        run: npm run assemble:pages && npm run test:pair

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload both versions as one isolated Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-dist

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy both verified editions
        id: deployment
        uses: actions/deploy-pages@v4
